<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Erik András Birkl, software engineer in Budapest. Web interfaces with React and TypeScript."
    />
    <meta name="author" content="Birkl Erik András" />
    <meta name="theme-color" content="#f3efe6" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Erik András Birkl – Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer in Budapest. Web interfaces with React and TypeScript."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Apply the saved theme and language before the first paint (no flash). -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme
          if (theme === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#16140f')
          }
        }
        var lang = localStorage.getItem('lang')
        if (lang === 'hu' || lang === 'en') document.documentElement.lang = lang
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Erik András Birkl – Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
